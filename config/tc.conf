#!/bin/bash
# tc setup for throttle mode
# called by fw-censor CLI !! not run directly !!

IFACE="wlan0"

# rates
TOTAL_RATE="100mbit"       # total bandwidth available on wlan0
NORMAL_RATE="100mbit"      # normal traffic — full speed
THROTTLE_RATE="128kbit"    # throttled traffic — dial-up speed
THROTTLE_CEIL="256kbit"    # burst ceiling for throttled class
THROTTLE_LATENCY="500ms"   # added latency for throttled traffic

tc_enable_throttle() {
    # -----------------------------------------------------------
    # root qdisc: HTB (Hierarchy Token Bucket)
    # handle 1: root qdisc identifier
    # default 10: unmarked traffic goes to class 1:10 (normal)
    # -----------------------------------------------------------
    tc qdisc add dev $IFACE root handle 1: htb default 10

    # -----------------------------------------------------------
    # root class -> total bandwidth ceiling
    # class 1:1 -> parent class, sets overall rate
    # -----------------------------------------------------------
    tc class add dev $IFACE parent 1: classid 1:1 \
        htb rate $TOTAL_RATE

    # -----------------------------------------------------------
    # class 1:10 - normal traffic (default)
    # unmarked packets land here (full rate)
    # -----------------------------------------------------------
    tc class add dev $IFACE parent 1:1 classid 1:10 \
        htb rate $NORMAL_RATE ceil $TOTAL_RATE

    # -----------------------------------------------------------
    # class 1:20 - throttled traffic
    # marked packets (0x1) land here (severely rate limited
    # netem adds artificial latency on top of rate limiting)
    # -----------------------------------------------------------
    tc class add dev $IFACE parent 1:1 classid 1:20 \
        htb rate $THROTTLE_RATE ceil $THROTTLE_CEIL

    # add netem qdisc as leaf for class 1:20 (adds latency
    # handle 20 -> identifies this leaf qdisc
    tc qdisc add dev $IFACE parent 1:20 handle 20: \
        netem delay $THROTTLE_LATENCY
    # When feeling funky: could simulate packet loss, jitter, duplication, reordering

    # -----------------------------------------------------------
    # filter to match packet mark 0x1 -> class 1:20
    # protocol ip and ipv6 handled separately
    # handle 1 - matches mark value 0x1 (feom nftables)
    # flowid 1:20 - sends to throttled class
    # -----------------------------------------------------------
    tc filter add dev $IFACE parent 1: protocol ip \
        handle 1 fw flowid 1:20

    tc filter add dev $IFACE parent 1: protocol ipv6 \
        handle 1 fw flowid 1:20

    echo "tc throttling active on $IFACE"
    echo "  normal traffic:    $NORMAL_RATE"
    echo "  throttled traffic: $THROTTLE_RATE + ${THROTTLE_LATENCY} latency"
}

tc_disable_throttle() {
    # remove root qdisc -> this removes all child classes and filters
    tc qdisc del dev $IFACE root 2>/dev/null || true
    echo "tc throttling removed from $IFACE"
}

tc_status() {
    echo "--- tc qdiscs on $IFACE ---"
    tc qdisc show dev $IFACE

    echo ""
    echo "--- tc classes on $IFACE ---"
    tc class show dev $IFACE

    echo ""
    echo "--- tc filters on $IFACE ---"
    tc filter show dev $IFACE

    echo ""
    echo "--- tc statistics (bytes/packets per class) ---"
    tc -s class show dev $IFACE
}