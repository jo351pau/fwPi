#! /usr/sbin/nft -f

# /etc/nftables.conf

flush ruleset

define WAN_IF = "eth0"
define LAN_IF = "wlan0"

define PIHOLE_IP4 = 192.168.50.1
define PIHOLE_IP6 = 2a06:d1c1:ee:1::1

table inet filter {
    set deny_ipv4 {
                type ipv4_addr
                flags interval
                auto-merge
                include "/etc/nftables/deny_ipv4.txt"
            }
    set deny_ipv6 {
                type ipv6_addr
                flags interval
                auto-merge
                include "/etc/nftables/deny_ipv6.txt"
            }
    set deny_ipv4_dns {
                type ipv4_addr
                flags interval
                auto-merge
                include "/etc/nftables/deny_ipv4_dns.txt"
            }
    set deny_ipv6_dns {
                type ipv6_addr
                flags interval
                auto-merge
                include "/etc/nftables/deny_ipv6_dns.txt"
            }
}

table inet nat {
    chain prerouting {
        type nat hook prerouting priority -100;

        # DNS -> Pi-hole
        iifname $LAN_IF ip daddr != $PIHOLE_IP4 udp dport 53 redirect to :53
        iifname $LAN_IF ip daddr != $PIHOLE_IP4 tcp dport 53 redirect to :53
        iifname $LAN_IF ip6 daddr != $PIHOLE_IP6 udp dport 53 redirect to :53
        iifname $LAN_IF ip6 daddr != $PIHOLE_IP6 tcp dport 53 redirect to :53
    }
    chain postrouting {
        type nat hook postrouting priority 100;

        # Masquerade traffic leaving via eth0
        oif $WAN_IF masquerade
    }
}
table inet filter {
    chain input {
        type filter hook input priority 0;
        policy drop;

        ct state established,related accept

        iif lo accept
        ip protocol icmp accept
        ip6 nexthdr icmpv6 accept

        # DHCP (LAN) request and reply
        iifname $LAN_IF udp dport 67 accept
        iifname $LAN_IF udp dport 547 accept
        # DNS (Pi-hole)
        iifname $LAN_IF udp dport 53 accept
        iifname $LAN_IF tcp dport 53 accept

        # SSH (LAN only)
        iif $LAN_IF tcp dport 22 accept
    }
    chain output {
        type filter hook output priority 0;
        policy accept;
    }
    chain forward {
        type filter hook forward priority 0;
        policy drop;

        ct state established,related accept

        ip daddr @deny_ipv4 counter drop
        ip saddr @deny_ipv4 counter drop
        ip6 daddr @deny_ipv6 counter drop
        ip6 saddr @deny_ipv6 counter drop

        # DNS dropping is this neccessary??
        ip daddr @deny_ipv4_dns counter drop
        ip saddr @deny_ipv4_dns counter drop
        ip6 daddr @deny_ipv6_dns counter drop
        ip6 saddr @deny_ipv6_dns counter drop

        # Block DoT
        tcp dport 853 counter drop
        udp dport 853 counter drop
        # Blcok Quic
        udp dport 443 counter drop

        # General internet access
        iifname $LAN_IF oif $WAN_IF accept
    }
}

