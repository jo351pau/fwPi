table inet filter {

    set deny_ipv4 {
                type ipv4_addr
                flags interval
                elements = {
                    10.10.10.10,
                    192.168.50.0/24
                    }
            }

    set deny_ipv6 {
                type ipv6_addr
                flags interval
                elements = {}
            }

    set allow_tcp_port {
                type inet_service
                flags interval
                elements = {80,443,25,110,53}
            }

    set allow_udp_port {
                    type inet_service
                    flags interval
                    elements = {443,123,53}
                }

    set deny_port {
                    type ipv4_addr
                    flags interval
                    elements = {}
                }

    set deny_port {
                    type ipv4_addr
                    flags interval
                    elements = {}
                }
